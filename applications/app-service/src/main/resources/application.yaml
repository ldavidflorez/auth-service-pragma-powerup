server:
  port: 8081
spring:
  application:
    name: "AuthService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  sql:
    init:
      mode: "always"
      schema-locations: "classpath:schema.sql"
  config:
    import: "optional:classpath:/application-{profile}.yaml"

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
  packages-to-scan: co.com.powerup.pragma.api

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "pragma_auth"
    schema: "public"
    username: "postgres"
    password: "postgres"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
